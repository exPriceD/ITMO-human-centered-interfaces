<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка событий</title><link rel="stylesheet" href="style.css"><style>main{max-width:1200px;margin:auto;padding:35px 24px}h1{font-size:32px}table{border-collapse:collapse;width:100%;margin-top:25px;background:#fff;font-size:13px}th,td{text-align:left;padding:12px;border:1px solid #dce2e5;vertical-align:top}pre{white-space:pre-wrap;word-break:break-all;margin:0}#meta{line-height:1.8;margin:20px 0}nav{display:flex;flex-wrap:wrap;gap:12px}</style></head><body><main><h1>Проверка событий</h1><p>Журнал текущего браузера. Он не заменяет отчёты Яндекс.Метрики по всем участникам.</p><p id="meta"></p><nav><a class="button" href="./?test=1#catalog">Открыть тестовый сценарий</a><button class="button secondary" id="export">Скачать журнал JSON</button><button class="button secondary" id="clear">Очистить локальный журнал</button></nav><div style="overflow:auto"><table><thead><tr><th>Время</th><th>Событие</th><th>Режим</th><th>Параметры</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>let rows=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){try{rows=JSON.parse(localStorage.getItem('pp_events')||'[]');}catch{rows=[];}document.querySelector('#meta').textContent='Событий: '+rows.length+'. Учебные проверки отмечены как тестовые и не отправляются в Метрику.';document.querySelector('#rows').innerHTML=rows.slice().reverse().map(r=>'<tr><td>'+esc(r.time)+'</td><td>'+esc(r.event)+'</td><td>'+(r.test_session?'Тест':'Обычный')+'</td><td><pre>'+esc(JSON.stringify(r,null,2))+'</pre></td></tr>').join('');}document.querySelector('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='python-events.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);};document.querySelector('#clear').onclick=()=>{localStorage.removeItem('pp_events');render();};window.addEventListener('storage',render);render();</script></body></html>
